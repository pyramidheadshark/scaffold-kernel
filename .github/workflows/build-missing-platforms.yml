name: Build Missing Platforms (hosted, для pi-scaffold)

# Точечная сборка платформ, которые pi-scaffold (приватный репозиторий) не может
# собрать на своих self-hosted-раннерах (только linux-x64) и не может собрать на
# ХОСТЕД-раннерах приватного репозитория, если у него кончились платные Actions-минуты.
# scaffold-kernel — публичный репозиторий: хостед-раннеры (ubuntu-24.04-arm,
# macos-latest, windows-latest) здесь бесплатны и почти безлимитны.
#
# Дублирует ТОЛЬКО шаги build-джобы pi-scaffold/.github/workflows/build-kernel.yml,
# необходимые для сборки бинаря (без клонирования форка — этот воркфлоу УЖЕ выполняется
# внутри дерева форка, checkout текущего репозитория и есть источник) и без секретов
# подписи (подпись остаётся привилегией pi-scaffold — MINISIGN_SECRET_KEY здесь не
# нужен и не задан). Результат — артефакты воркфлоу (retention 7 дней), которые
# pi-scaffold скачивает через `gh run download` (тот же владелец аккаунта, `gh auth`
# уже покрывает оба репозитория — кросс-репо PAT не требуется).
#
# Синхронизировать вручную при изменении build-джобы pi-scaffold: шаги сборки бинаря,
# резолва bun-пина и smoke-теста должны совпадать по СУТИ (что проверяется и как), но
# НЕ ДОСЛОВНО — среда здесь другая (bun workspace vs обычный package.json), и минимум
# два места это уже требуют: установка node-pty (`bun add`, не `npm install` — см. ниже)
# и путь к windows-tui-smoke.mjs (тулинг живёт на main, не на пиненном inputs.ref — см.
# отдельный checkout перед смоком). Оба расхождения найдены живыми прогонами 09.09.2026,
# не рассуждением — при копировании строк из pi-scaffold сверяться с этими комментариями.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git-ref (тег/ветка/sha) ЭТОГО репозитория, из которого собирать — обычно тег UPSTREAM_PIN. Не путать с тем, каким ref задиспатчен сам воркфлоу: workflow_dispatch по API требует ref, где ФАЙЛ воркфлоу уже существует (main), а собирать при этом нужно ровно закреплённый тег.'
        required: true
        type: string
      kernel_version:
        description: 'Версия ядра для package.json (обычно KERNEL_VERSION из pi-scaffold)'
        required: true
        type: string
      platforms:
        description: 'Платформы через запятую из {linux-arm64, darwin-arm64, windows-x64}'
        required: false
        default: 'linux-arm64,darwin-arm64,windows-x64'
        type: string

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve requested platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix JSON from requested platforms
        id: matrix
        run: |
          set -euo pipefail
          declare -A RUNNER=(
            [linux-arm64]='["ubuntu-24.04-arm"]'
            [darwin-arm64]='["macos-latest"]'
            [windows-x64]='["windows-latest"]'
          )
          declare -A BUN_TARGET=(
            [linux-arm64]=bun-linux-arm64
            [darwin-arm64]=bun-darwin-arm64
            [windows-x64]=bun-windows-x64
          )
          IFS=',' read -ra WANTED <<< "${{ inputs.platforms }}"
          ENTRIES=()
          for p in "${WANTED[@]}"; do
            p="$(echo "$p" | xargs)"
            [[ -z "$p" ]] && continue
            if [[ -z "${RUNNER[$p]:-}" ]]; then
              echo "::error::неизвестная или неподдерживаемая здесь платформа: '$p' (доступны: linux-arm64, darwin-arm64, windows-x64 — linux-x64 остаётся на self-hosted pi-scaffold)"
              exit 1
            fi
            ENTRIES+=("{\"target\":\"$p\",\"runner\":${RUNNER[$p]},\"bun_target\":\"${BUN_TARGET[$p]}\"}")
          done
          if [[ ${#ENTRIES[@]} -eq 0 ]]; then
            echo "::error::пустой список платформ"
            exit 1
          fi
          JSON="{\"include\":[$(IFS=,; echo "${ENTRIES[*]}")]}"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "Matrix: $JSON"

  verify-patches:
    name: Verify critical Scaffold patches present
    needs: resolve-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned ref (source to verify)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: kernel-src
      - name: Checkout main (verifier tooling)
        # Тот же приём, что в pi-scaffold/build-kernel.yml ("Checkout pi-scaffold
        # (verifier source)"): verify-fork-patches.sh — тулинг, не патченый исходник,
        # и не обязан существовать в старом закреплённом теге (inputs.ref может
        # указывать на тег, созданный ДО того, как скрипт сюда завезли). Берём его
        # всегда с main этого же репозитория, независимо от того, что проверяем.
        uses: actions/checkout@v4
        with:
          ref: main
          path: verifier
      - name: Verify critical Scaffold patches (PI-80/PI-129)
        run: bash verifier/scripts/fork-setup/verify-fork-patches.sh --strict kernel-src

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve-matrix, verify-patches]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set KERNEL_VERSION in package.json
        run: |
          KVER="${{ inputs.kernel_version }}"
          node -e "
            const fs = require('fs');
            const p = 'packages/opencode/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.KVER;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            console.log('package.json: name=' + pkg.name + ' version=' + pkg.version);
          " KVER="$KVER"

      - name: Resolve bun version pinned by this repo's own package.json
        id: bun-pin
        run: |
          PIN=$(node -e "
            const fs = require('fs');
            try {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              const pm = pkg.packageManager || '';
              const m = pm.match(/^bun@(.+)$/);
              console.log(m ? m[1] : 'latest');
            } catch { console.log('latest'); }
          ")
          echo "version=$PIN" >> "$GITHUB_OUTPUT"
          echo "Resolved bun-version: $PIN"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-pin.outputs.version }}

      - name: Install dependencies
        working-directory: .
        run: bun install

      - name: Build binary
        id: build_binary
        env:
          MIMOCODE_VERSION: ${{ inputs.kernel_version }}
          MIMOCODE_CHANNEL: local
        working-directory: packages/opencode
        run: |
          bun run script/build.ts --single
          BUILT=$(find dist -name "mimo" -o -name "mimo.exe" 2>/dev/null | head -1)
          if [ -z "$BUILT" ]; then
            echo "ERROR: no binary found in dist/"
            find dist/ -type f | head -20
            exit 1
          fi
          echo "Built: $BUILT"
          mkdir -p ../../dist
          case "$BUILT" in
            *.exe) OUT="../../dist/scaffold-${{ matrix.target }}.exe" ;;
            *) OUT="../../dist/scaffold-${{ matrix.target }}" ;;
          esac
          cp "$BUILT" "$OUT"
          echo "Copied to: $OUT"
          echo "output_name=$(basename "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Verify binary
        run: |
          BIN="dist/${{ steps.build_binary.outputs.output_name }}"
          chmod +x "$BIN"
          "$BIN" --version

      - name: 'Smoke — ToolRegistry bootstrap (PI-69)'
        run: |
          BIN="dist/${{ steps.build_binary.outputs.output_name }}"
          set +e
          OUT=$(echo "" | timeout 30 "$BIN" run --agent build "noop" 2>&1)
          set -e
          echo "$OUT" | tail -40
          if echo "$OUT" | grep -qiE "Service not found|SessionGoal|defaultLayer|ToolRegistry.*not found"; then
            echo "::error::ToolRegistry bootstrap упал — registry/Service ошибка на старте (класс PI-69)"
            exit 1
          fi
          echo "✓ ToolRegistry bootstrap OK"

      # Смок над реальным ConPTY, вендорен из pi-scaffold (09.09.2026). Причина, почему
      # он здесь, а не в pi-scaffold/build-kernel.yml: тот воркфлоу живёт на облачных
      # минутах ПРИВАТНОГО pi-scaffold, а remote_platforms используется РОВНО тогда,
      # когда этих минут не осталось — попытка смок-тестировать удалённо собранный
      # windows-x64 обратно в pi-scaffold гарантированно не получит раннер (живой
      # прогон 09.09.2026 подтвердил: 3 секунды, пустой runner_name, 0 шагов). Здесь,
      # в публичном scaffold-kernel, минуты бесплатны и раннер уже выдан — тестируем
      # бинарь тут же, пока он ещё свежесобран.
      # ⚠ Здесь НАМЕРЕННО `bun add`, а не `npm install` (как в оригинале pi-scaffold) —
      # scaffold-kernel это bun workspace с `catalog:`-протоколом версий (package.json,
      # корень), который npm не понимает (`EUNSUPPORTEDPROTOCOL`); живой прогон 09.09.2026
      # подтвердил падение с npm. При синхронизации с pi-scaffold ЭТУ строку не копировать
      # дословно.
      #
      # ⚠ И `--trust` здесь обязателен, не опционален: bun по умолчанию НЕ выполняет
      # lifecycle-скрипты (postinstall) устанавливаемых пакетов ради безопасности —
      # `node-pty-prebuilt-multiarch` качает нативный `conpty.node` именно через
      # postinstall, и без `--trust` он не выполняется. Живой прогон 09.09.2026 (run
      # 34298773864) подтвердил падение без флага: "Cannot find module
      # '../build/Release/conpty.node'" в windowsPtyAgent.js при попытке смок-теста.
      - name: Install node-pty for ConPTY smoke (windows-x64 only)
        if: matrix.target == 'windows-x64'
        run: bun add --trust @homebridge/node-pty-prebuilt-multiarch@0.11.14

      # Тот же приём, что в джобе verify-patches ("Checkout main (verifier tooling)"):
      # windows-tui-smoke.mjs — CI-тулинг, не патченый исходник ядра, и не обязан
      # существовать на inputs.ref, если это тег, созданный ДО того, как скрипт сюда
      # завезли (PR #33). Живой прогон 09.09.2026 подтвердил падение
      # MODULE_NOT_FOUND на теге scaffold-v0.1.50 (создан до PR #33). Берём тулинг
      # всегда с main этого же репозитория, независимо от того, что собираем.
      - name: Checkout main (smoke tooling, windows-x64 only)
        if: matrix.target == 'windows-x64'
        uses: actions/checkout@v4
        with:
          ref: main
          path: ci-tools

      - name: 'Smoke — ConPTY TUI rendering (windows-x64 only)'
        if: matrix.target == 'windows-x64'
        run: node ci-tools/scripts/fork-setup/windows-tui-smoke.mjs "dist/${{ steps.build_binary.outputs.output_name }}" windows-tui-smoke.log

      - name: Upload ConPTY smoke log (windows-x64 only)
        if: matrix.target == 'windows-x64' && always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-tui-smoke-log
          path: windows-tui-smoke.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: scaffold-${{ matrix.target }}
          path: dist/${{ steps.build_binary.outputs.output_name }}
          retention-days: 7
          if-no-files-found: error
